# Ruff config for trimul/. Discovered automatically when ruff runs from this dir or below.

# work/hopper_gemm_ws.py is auto-generated by make_submission.py — re-running
# the generator wipes any manual edits, so we don't lint it.
exclude = ["work/hopper_gemm_ws.py"]

[lint.per-file-ignores]
# Profile wrappers must set TRITON_PLUGIN_PATHS env var BEFORE importing triton,
# and import side-effect modules (utlx_plugin) — both legitimate.
"work/*.py" = [
    "E402",  # module-import-not-at-top-of-file (uTLX setup must precede triton)
    "F401",  # unused-import (utlx_plugin etc. loaded for side effects)
    "E501",  # line-too-long (long URL/path strings in setup code)
    "F841",  # unused-variable (`out` from kernel calls in benchmark loops)
]
