# Per-wheel selection of monkey patches from kernels/tlx_patches.py.
#
# Lookup: keyed by the utlx wheel commit (the local segment of the installed
# version, e.g. `pip show utlx | awk '/^Version/ {print $2}'` →
# `0.1.0+gitf3d635af` → `f3d635af`).
#
# Resolution order (see tlx_patches.resolve_for_kernel):
#   1. Kernel module declares `__tlx_patches__ = [...]` at top-level.
#   2. This file: section matching the utlx commit.
#   3. Section [default] below.
#
# A list of names selects exactly those. The string "all" expands to every
# patch registered with default=True in tlx_patches.py.

[default]
patches = "all"

# Initial wheel — entire bridge layer needed.
[utlx."f3d635af"]
patches = [
    "semantic_shims",
    "dispatch_visit_with",
    "make_tensor_descriptor",
    "wgmma_use_acc_default",
    "broadcast_shape_overload",
    "gluon_op_builder_swap",
    "async_load_native",
    "wgmma_acc_layout_setup",
    "warp_specialize_codegen",
]

# Previous wheel — same patch surface as f3d635af; see ENABLEMENT.md#47debefa.
[utlx."47debefa"]
patches = [
    "semantic_shims",
    "dispatch_visit_with",
    "make_tensor_descriptor",
    "wgmma_use_acc_default",
    "broadcast_shape_overload",
    "gluon_op_builder_swap",
    "async_load_native",
    "wgmma_acc_layout_setup",
    "warp_specialize_codegen",
]

# Current wheel — async_dot, make_tensor_descriptor, and tlx layout markers
# are now fixed in-wheel (see ENABLEMENT.md#cba4ef9a). Drops:
#   - `make_tensor_descriptor`     (wheel emits gluon binding with NVMMA layout)
#   - `wgmma_acc_layout_setup`     (wheel async_dot preserves loop-carry acc and
#                                   includes wait + convert_layout inline; the
#                                   C++ TLXLayoutMarkerPattern lowers the
#                                   surviving release_layout marker)
[utlx."cba4ef9a"]
patches = [
    "semantic_shims",
    "dispatch_visit_with",
    "wgmma_use_acc_default",
    "broadcast_shape_overload",
    "gluon_op_builder_swap",
    "async_load_native",
    "warp_specialize_codegen",
]
